global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["gateway:8000"]
    metrics_path: /metrics
  - job_name: iam-service
    static_configs:
      - targets: ["iam-service:8000"]
    metrics_path: /metrics
  - job_name: patient-service
    static_configs:
      - targets: ["patient-service:8000"]
    metrics_path: /metrics
  - job_name: clinical-service
    static_configs:
      - targets: ["clinical-service:8000"]
    metrics_path: /metrics
  - job_name: ai-service
    static_configs:
      - targets: ["ai-service:8000"]
    metrics_path: /metrics
  - job_name: reporting-service
    static_configs:
      - targets: ["reporting-service:8000"]
    metrics_path: /metrics
