name: CI Service - Python (FastAPI)

on:
  pull_request:
    branches: [ main, developer ]
  push:
    branches: [ developer ]

env:
  PYTHON_VERSION: '3.11'

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt || true
          if [ -f backend/requirements-dev.txt ]; then pip install -r backend/requirements-dev.txt || true; fi

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check . || exit 1

      - name: Type check (mypy)
        run: |
          pip install mypy
          mypy backend || true

      - name: Run tests (pytest)
        run: |
          pip install pytest pytest-cov
          pytest backend -q --junitxml=reports/junit-results.xml || exit 1
        continue-on-error: false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: backend/reports/junit-results.xml

  build-image:
    runs-on: ubuntu-latest
    needs: test-and-lint
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to registry
        if: env.DOCKER_REGISTRY_USER
        uses: docker/login-action@v2
        with:
          registry: ${{ env.DOCKER_REGISTRY_HOST }}
          username: ${{ secrets.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_TOKEN }}

      - name: Build and push image
        env:
          IMAGE_NAME: ${{ env.DOCKER_REGISTRY_HOST }}/${{ github.repository }}:${{ github.sha }}
        run: |
          docker buildx build --platform linux/amd64 --tag "$IMAGE_NAME" --push .

      - name: Image scan (trivy)
        if: ${{ secrets.TRIVY_TOKEN != '' }}
        run: |
          docker pull $IMAGE_NAME
          trivy image --exit-code 1 --severity CRITICAL $IMAGE_NAME || true

